[project]
site_name = "PyJobShop"
site_description = "Solving scheduling problems with constraint programming."
site_author = "Leon Lan"
site_url = "https://pyjobshop.readthedocs.io/"
copyright = "Copyright &copy; 2023 - 2026, Leon Lan"
repo_url = "https://github.com/PyJobShop/PyJobShop/"
repo_name = "PyJobShop/PyJobShop"
docs_dir = "source"
site_dir = "build"
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
  { "Getting started" = [
      { "Home" = "index.md" },
      { "Introduction to scheduling" = "setup/intro_to_scheduling.md" },
      { "Introduction to CP" = "setup/intro_to_cp.md" },
      { "Installation" = "setup/installation.md" },
      { "Getting help" = "setup/getting_help.md" },
      { "Citing" = "setup/citing.md" },
  ]},
  { "Examples" = [
      { "Simple example" = "examples/simple_example.md" },
      { "Flexible job shop" = "examples/flexible_job_shop.md" },
      { "Hybrid flow shop" = "examples/hybrid_flow_shop.md" },
      { "Permutation flow shop" = "examples/permutation_flow_shop.md" },
      { "Project scheduling" = "examples/project_scheduling.md" },
      { "Optional tasks" = "examples/optional_tasks.md" },
      { "Breaks" = "examples/breaks.md" },
      { "Sequencing" = "examples/sequencing.md" },
      { "Objectives" = "examples/objectives.md" },
      { "Solver tips" = "examples/solver_tips.md" },
  ]},
  { "API reference" = [
      { "PyJobShop" = "api/pyjobshop.md" },
      { "Plotting" = "api/plot.md" },
  ]},
  { "Developing PyJobShop" = [
      { "Contributing" = "dev/contributing.md" },
      { "Resources" = "dev/resources.md" },
  ]},
]

[project.theme]
features = [
    "content.code.copy",
    "navigation.expand",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "purple"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "purple"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "table"
members_order = "source"
separate_signature = true
show_signature_annotations = true
show_root_heading = true
show_source = false
heading_level = 2

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
