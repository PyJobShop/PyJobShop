version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --all-groups
    - cd docs && uv run python build_examples.py
    - cd docs && uv run zensical build --clean
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -a docs/build/. $READTHEDOCS_OUTPUT/html
